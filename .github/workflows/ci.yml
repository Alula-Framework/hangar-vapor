name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # hangar calls this so a change there is tested against the package that
  # wraps it. Without it, this workflow only ran when this repository was
  # pushed to — which last happened in August, while a committed
  # Package.resolved quietly held hangar at 0.4.0 through two releases.
  workflow_call:
    inputs:
      hangar_ref:
        description: "The hangar commit to build this package against."
        type: string
        default: ""

# The literal prefix is load-bearing: inside a called workflow the `github`
# context is the *caller's*, so without it this group is the one hangar's own
# run already holds, and cancel-in-progress means this never starts.
concurrency:
  group: hangar-vapor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Swift ${{ matrix.swift }})
    runs-on: ubuntu-latest
    container: swift:${{ matrix.swift }}
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.3.3"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hangar_vapor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Named, because inside a called workflow a bare checkout clones hangar
      # rather than this package.
      - uses: actions/checkout@v4
        with:
          repository: Flight-Framework/hangar-vapor
          ref: ${{ inputs.hangar_ref != '' && 'main' || github.sha }}

      - name: Check out the hangar commit under review
        if: inputs.hangar_ref != ''
        uses: actions/checkout@v4
        with:
          repository: Flight-Framework/hangar
          ref: ${{ inputs.hangar_ref }}
          path: .hangar-under-review

      # sed rather than the python dev-link.sh uses: the Swift images are slim
      # and ship no python3, which is how flight-data's equivalent step died
      # with exit 127 the first time it was ever reached.
      - name: Point the manifest at it
        if: inputs.hangar_ref != ''
        run: |
          sed -i 's|.package(url: "https://github.com/Flight-Framework/hangar.git", from: "[0-9.]*"),|.package(path: ".hangar-under-review"),|' Package.swift
          grep -q 'hangar-under-review' Package.swift || {
            echo "::error::manifest rewrite did not take"
            exit 1
          }

      - name: Build (warnings are errors)
        run: swift build -Xswiftc -warnings-as-errors

      # Fails rather than silently skipping if the database is unreachable.
      # These tests exist to prove behaviour against a real pool; a green run
      # that skipped all of them proves nothing.
      #
      # This used to test whether the variable was empty, in a step that set it
      # to a literal on the line above — it could never fire. What actually
      # goes wrong is the service, so open the socket instead.
      - name: Verify the integration gate is armed
        run: |
          if ! timeout 10 bash -c 'cat < /dev/null > /dev/tcp/postgres/5432' 2>/dev/null; then
            echo "::error::postgres:5432 is unreachable — the integration tests would skip"
            exit 1
          fi
          echo "postgres:5432 is reachable"

      - name: Test
        env:
          HANGAR_VAPOR_TEST_DATABASE_URL: postgres://postgres:postgres@postgres:5432/hangar_vapor_test
        run: ./CI/run-tests.sh

  macos:
    name: Build on macOS
    runs-on: macos-26
    # swift-configuration's FileProvider takes FoundationEssentials where the
    # SDK offers it and Foundation otherwise, and only the latter lacks the
    # `Data.bytes` it wants. That made this job red on macos-15 and was read as
    # an upstream blocker nothing here could fix. It is an SDK question: on
    # macos-26 flight builds with its deployment target untouched, measured
    # both ways. Same fix here, and the advisory flag comes off with it.
    steps:
      - uses: actions/checkout@v4

      # 6.2 rather than the 6.3.3 the Linux job uses: setup-swift does not
      # index 6.3 yet. It satisfies this package's tools version.
      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"

      # macOS runners have no Docker and GitHub service containers are
      # Linux-only, so the integration suite cannot run here. This job proves
      # the platform claim in Package.swift compiles.
      - name: Build (warnings are errors)
        run: swift build -Xswiftc -warnings-as-errors
